services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-gallery-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_gallery
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: